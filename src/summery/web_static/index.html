<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>summery｜影音逐字稿與摘要</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#16202c; --muted:#657285; --line:#e3e7ee;
    --brand:#1f5fd0; --brand-dark:#17458f; --ok:#1a7f4b; --warn:#b26a00; --err:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
  header{background:linear-gradient(135deg,var(--brand-dark),var(--brand));color:#fff;padding:22px 20px}
  header .wrap{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  h1{margin:0;font-size:22px;letter-spacing:.5px}
  h1 small{font-weight:400;opacity:.82;font-size:13px;margin-left:10px}
  .cfg{font-size:12.5px;opacity:.92;text-align:right}
  .cfg code{background:rgba(255,255,255,.16);padding:1px 6px;border-radius:5px}
  main{max-width:1180px;margin:22px auto 60px;padding:0 20px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .card + .card{margin-top:18px}
  h2{font-size:15px;margin:0 0 12px;letter-spacing:.4px}
  .drop{border:2px dashed #c3ccdb;border-radius:12px;padding:26px;text-align:center;background:#fbfcfe;transition:.15s}
  .drop.over{border-color:var(--brand);background:#eef4ff}
  .drop p{margin:6px 0;color:var(--muted);font-size:14px}
  .drop strong{color:var(--ink)}
  input[type=file]{display:none}
  .btn{background:var(--brand);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-size:14px;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--brand-dark)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  .btn.small{padding:6px 11px;font-size:12.5px}
  .btn.danger{background:#fff;color:var(--err);border:1px solid #eccfcb}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
  label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
  select,textarea,input[type=text],input[type=number]{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13.5px;color:var(--ink);background:#fff}
  textarea{min-height:56px;resize:vertical}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px}
  .row label{display:inline;margin:0}
  .bar{height:9px;background:#eceff4;border-radius:99px;overflow:hidden;margin:12px 0 6px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),#4f8ff0);transition:width .4s ease}
  .meta{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .pill{font-size:11.5px;padding:2px 9px;border-radius:99px;background:#eef1f6;color:#4a5568}
  .pill.done{background:#e4f3ea;color:var(--ok)} .pill.running{background:#e6effc;color:var(--brand)}
  .pill.failed{background:#fbeae8;color:var(--err)} .pill.partial{background:#fdf3e2;color:var(--warn)}
  .pill.queued{background:#eceff4;color:var(--muted)}
  .jobs{max-height:340px;overflow:auto;margin:0;padding:0;list-style:none}
  .jobs li{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
  .jobs li:last-child{border-bottom:0} .jobs li:hover{background:#fafbfd}
  .jobs b{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
  .tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font-size:13.5px;cursor:pointer;color:var(--muted);font-family:inherit}
  .tabs button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
  .pane{display:none} .pane.on{display:block}
  .sum h3{font-size:16px;margin:0 0 6px}
  .sum .tldr{background:#f2f6ff;border-left:3px solid var(--brand);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
  .sum h4{font-size:13.5px;margin:20px 0 6px;color:var(--brand-dark);letter-spacing:.4px}
  .sum ul{margin:0;padding-left:20px;font-size:13.8px} .sum li{margin:4px 0}
  .sum p{font-size:13.8px;margin:7px 0}
  .ch{display:grid;grid-template-columns:80px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .ch time{font-variant-numeric:tabular-nums;color:var(--brand);font-weight:600;font-size:12.5px}
  .ch b{font-size:13.5px} .ch small{display:block;color:var(--muted);font-size:12.8px}
  pre.tx{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.8px;background:#0f172a08;padding:14px;border-radius:9px;max-height:460px;overflow:auto;margin:0}
  pre.tx::selection,pre.tx mark{background:#ffe9a8}
  .files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .files a{font-size:12.5px;text-decoration:none;color:var(--brand);border:1px solid var(--line);padding:5px 10px;border-radius:7px;background:#fff}
  .files a:hover{border-color:var(--brand)}
  .empty{color:var(--muted);font-size:13.5px}
  .alert{border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:14px}
  .alert.warn{background:#fdf6e8;color:#7a5200;border:1px solid #f0dcae}
  .alert.err{background:#fdecea;color:#8f2419;border:1px solid #f3cdc7}
  .muted{color:var(--muted)} .hidden{display:none}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>summery<small>影片 / 音訊 → 逐字稿 + 摘要</small></h1>
  <div class="cfg" id="cfg">載入設定中…</div>
</div></header>

<main>
<div>
  <section class="card">
    <h2>1. 上傳影音</h2>
    <div id="warn" class="alert warn hidden"></div>
    <div class="drop" id="drop">
      <p><strong>拖曳影片或音訊檔到此處</strong>，或</p>
      <button class="btn ghost" id="pick" type="button">選擇檔案</button>
      <p id="fname" class="muted">支援 mp4 / mov / mkv / webm / mp3 / wav / m4a …</p>
      <input type="file" id="file" accept="video/*,audio/*,.mkv,.ts,.m4v,.opus">
    </div>

    <div class="grid">
      <div><label for="style">摘要風格</label>
        <select id="style"><option value="standard">標準</option><option value="concise">精簡</option>
        <option value="comprehensive">完整</option><option value="bullets">條列</option></select></div>
      <div><label for="slang">摘要語言</label>
        <select id="slang"><option value="zh-TW">繁體中文</option><option value="auto">追隨原文</option>
        <option value="en">English</option><option value="zh-CN">簡體中文</option><option value="ja">日本語</option></select></div>
      <div><label for="alang">ASR 語言提示</label>
        <select id="alang"><option value="">自動偵測</option><option value="zh">中文</option>
        <option value="zh-TW">繁體中文</option><option value="en">英文</option><option value="ja">日文</option></select></div>
      <div><label for="chunk">切塊長度（秒）</label><input type="number" id="chunk" min="60" max="1800" step="30" placeholder="依伺服器預設"></div>
    </div>
    <div style="margin-top:12px"><label for="inst">附加摘要指示（選用）</label>
      <textarea id="inst" placeholder="例：聚焦法規遵循風險與預算數字"></textarea></div>
    <div class="row">
      <label><input type="checkbox" id="nosum"> 只做逐字稿（不摘要）</label>
      <label><input type="checkbox" id="nochap"> 不要章節摘要</label>
      <button class="btn" id="start" type="button" disabled>開始處理</button>
      <button class="btn danger hidden" id="cancel" type="button">取消工作</button>
    </div>
  </section>

  <section class="card">
    <h2>2. 處理進度</h2>
    <div class="meta"><span id="stage" class="pill queued">待機</span><span id="jobid" class="muted"></span></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="meta"><span id="msg" class="muted">尚未開始</span><span id="elapsed" class="muted"></span></div>
  </section>

  <section class="card hidden" id="resultCard">
    <h2>3. 結果</h2>
    <div id="rerr"></div>
    <div class="tabs">
      <button data-tab="sum" class="on">摘要</button><button data-tab="tx">逐字稿</button>
      <button data-tab="raw">原始 JSON</button>
    </div>
    <div class="pane on" id="pane-sum"><div class="sum empty" id="sum">尚無摘要</div></div>
    <div class="pane" id="pane-tx"><pre class="tx" id="tx">尚無逐字稿</pre></div>
    <div class="pane" id="pane-raw"><pre class="tx" id="raw">{}</pre></div>
    <div class="files" id="files"></div>
  </section>
</div>

<aside>
  <section class="card">
    <h2>工作列表</h2>
    <ul class="jobs" id="jobs"><li class="muted">尚無工作</li></ul>
  </section>
  <section class="card">
    <h2>長影音小提示</h2>
    <ul class="sum">
      <li>系統依<b>靜音點</b>切塊，逐塊並行轉錄，中斷後重跑會沿用已完成塊。</li>
      <li>逐字稿超出模型 context 時，自動改用 <b>map-reduce</b> 階層摘要。</li>
      <li>章節時間戳由逐字稿段落對照表決定，不會由模型編造。</li>
    </ul>
  </section>
</aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
let currentJob = null, pollTimer = null, startTs = 0;

async function loadConfig() {
  try {
    const res = await fetch('/api/config'); const cfg = await res.json();
    $('cfg').innerHTML = `ASR <code>${cfg.asr.model}</code>｜LLM <code>${cfg.llm.model}</code>｜切塊 ${cfg.chunking.target_seconds}s`;
    const missing = [];
    if (!cfg.asr.key_configured && !cfg.asr.stub) missing.push('ASR API key');
    if (!cfg.llm.key_configured && !cfg.llm.stub) missing.push('LLM API key');
    if (missing.length) {
      $('warn').textContent = '尚未設定 ' + missing.join('、') + '（以環境變數 ASR_API_KEY / LLM_API_KEY 或設定檔提供），工作會失敗。';
      $('warn').classList.remove('hidden');
    }
    $('chunk').placeholder = cfg.chunking.target_seconds + '（伺服器預設）';
  } catch (e) { $('cfg').textContent = '無法取得設定'; }
}

async function loadJobs() {
  const res = await fetch('/api/jobs'); const data = await res.json();
  const list = data.jobs || [];
  $('jobs').innerHTML = list.length ? '' : '<li class="muted">尚無工作</li>';
  list.forEach(j => {
    const li = document.createElement('li');
    li.innerHTML = `<b title="${j.name}">${j.name}</b>
      <span class="pill ${j.status}">${label(j.status)}</span>
      <span class="muted">${Math.round((j.progress || 0) * 100)}% · ${j.stage || ''}</span>`;
    li.onclick = () => selectJob(j.job_id);
    $('jobs').appendChild(li);
  });
}

function label(s) {
  return {queued:'排隊中', running:'處理中', done:'完成', partial:'部分完成', failed:'失敗', cancelled:'已取消', cancelling:'取消中'}[s] || s;
}

function selectJob(id) {
  currentJob = id; $('jobid').textContent = id;
  clearInterval(pollTimer); pollTimer = setInterval(pollJob, 1200); pollJob();
}

async function pollJob() {
  if (!currentJob) return;
  let d;
  try { d = await (await fetch('/api/jobs/' + currentJob)).json(); } catch (e) { return; }
  if (d.error) { showErr(d.error); return; }
  const pct = Math.round((d.progress || 0) * 100);
  $('fill').style.width = pct + '%';
  $('stage').className = 'pill ' + d.status; $('stage').textContent = label(d.status);
  $('msg').textContent = d.message || d.stage || '';
  if (d.created_at) $('elapsed').textContent = ((Date.now() / 1000) - d.created_at).toFixed(0) + 's';
  renderResult(d);
  if (['done','partial','failed','cancelled'].includes(d.status)) {
    clearInterval(pollTimer); pollTimer = null; $('cancel').classList.add('hidden');
    $('start').disabled = false; loadJobs();
  }
}

function renderResult(d) {
  const r = d.result || {};
  if (!r.summary && !r.transcript) { $('resultCard').classList.add('hidden'); return; }
  $('resultCard').classList.remove('hidden');
  const s = r.summary;
  if (s) {
    const parts = [`<h3>${esc(s.title || '摘要')}</h3>`];
    if (s.tldr) parts.push(`<div class="tldr">${esc(s.tldr)}</div>`);
    if ((s.overview || []).length) parts.push('<h4>內容概要</h4>' + s.overview.map(p => `<p>${esc(p)}</p>`).join(''));
    if ((s.chapters || []).length) {
      parts.push('<h4>章節摘要</h4>' + s.chapters.map(c => `<div class="ch"><time>${clock(c.start)}</time><div><b>${esc(c.title)}</b><small>${esc(c.summary || '')}</small>${(c.points || []).length ? '<ul>' + c.points.map(p => `<li>${esc(p)}</li>`).join('') + '</ul>' : ''}</div></div>`).join(''));
    }
    if ((s.key_points || []).length) parts.push('<h4>重點整理</h4><ul>' + s.key_points.map(p => `<li>${esc(p)}</li>`).join('') + '</ul>');
    if ((s.decisions || []).length) parts.push('<h4>結論與決策</h4><ul>' + s.decisions.map(p => `<li>${esc(p)}</li>`).join('') + '</ul>');
    if ((s.action_items || []).length) parts.push('<h4>待辦事項</h4><ul>' + s.action_items.map(a => `<li>${esc(a.task)}<span class="muted">（${esc(a.owner)}／${esc(a.due)}）</span></li>`).join('') + '</ul>');
    if ((s.open_questions || []).length) parts.push('<h4>待釐清</h4><ul>' + s.open_questions.map(p => `<li>${esc(p)}</li>`).join('') + '</ul>');
    if ((s.keywords || []).length) parts.push('<h4>關鍵字</h4><p>' + s.keywords.map(k => `<span class="pill">${esc(k)}</span>`).join(' ') + '</p>');
    if (s.meta && s.meta.mode) parts.push(`<p class="muted" style="font-size:12px">摘要模式：${esc(s.meta.mode)}｜估算 ${s.meta.estimated_input_tokens || '?'} tokens｜LLM 呼叫 ${(s.meta.llm_usage || {}).calls || 0} 次</p>`);
    $('sum').className = 'sum'; $('sum').innerHTML = parts.join('');
  }
  if (r.transcript) {
    const t = r.transcript;
    $('tx').textContent = (t.text || '（空）') + (t.truncated ? '\n…（僅顯示前段，請下載完整檔案）' : '');
    $('raw').textContent = JSON.stringify({stats: t.stats, summary: s ? {title: s.title, meta: s.meta} : null}, null, 2);
  }
  $('files').innerHTML = (d.files || []).map(f => `<a href="${f.url}">⬇ ${esc(f.name)} <span class="muted">(${(f.size/1024).toFixed(0)}KB)</span></a>`).join('');
  $('rerr').innerHTML = d.error ? `<div class="alert err">${esc(d.error)}</div>` : '';
}

function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function clock(sec) { const s = Math.max(0, Math.round(sec || 0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`; }
function showErr(msg) { $('resultCard').classList.remove('hidden'); $('rerr').innerHTML = `<div class="alert err">${esc(msg)}</div>`; }

$('pick').onclick = () => $('file').click();
$('file').onchange = () => { if ($('file').files[0]) setFile($('file').files[0]); };
['dragenter','dragover'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) setFile(f); });
let pending = null;
function setFile(f) { pending = f; $('fname').innerHTML = `<strong>${esc(f.name)}</strong>｜${(f.size/1048576).toFixed(1)} MB`; $('start').disabled = false; }

$('start').onclick = () => {
  if (!pending) return;
  const params = new URLSearchParams();
  params.set('style', $('style').value); params.set('summary_language', $('slang').value);
  if ($('alang').value) params.set('asr_language', $('alang').value);
  if ($('chunk').value) params.set('chunk_seconds', $('chunk').value);
  if ($('inst').value.trim()) params.set('instruction', $('inst').value.trim());
  if ($('nosum').checked) params.set('no_summary', '1');
  if ($('nochap').checked) params.set('no_chapters', '1');
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/jobs?' + params.toString());
  xhr.setRequestHeader('X-Filename', encodeURIComponent(pending.name));
  xhr.upload.onprogress = e => { if (e.lengthComputable) { const p = e.loaded / e.total; $('fill').style.width = (p * 60) + '%'; $('msg').textContent = `上傳中 ${(p * 100).toFixed(0)}%`; } };
  xhr.onload = () => {
    let data = {}; try { data = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status >= 300) { showErr(data.error || `上傳失敗 HTTP ${xhr.status}`); $('start').disabled = false; return; }
    currentJob = data.job_id; $('jobid').textContent = data.job_id;
    $('start').disabled = true; $('cancel').classList.remove('hidden');
    startTs = Date.now(); msg.textContent = '已送入背景佇列…';
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(pollJob, 1200); pollJob(); loadJobs();
  };
  xhr.onerror = () => { showErr('網路錯誤'); $('start').disabled = false; };
  $('start').disabled = true;
  xhr.send(pending);
};

$('cancel').onclick = async () => {
  if (!currentJob) return;
  await fetch(`/api/jobs/${currentJob}/cancel`, {method: 'POST'});
  $('msg').textContent = '已送出取消要求…';
};

document.querySelectorAll('.tabs button').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  btn.classList.add('on'); $('pane-' + btn.dataset.tab).classList.add('on');
});

loadConfig(); loadJobs();
setInterval(() => { if (!pollTimer) loadJobs(); }, 8000);
</script>
</body>
</html>
